[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ohmyllm"
version = "0.1.0"
description = "일본어 GPT-2 모델을 위한 어휘 교체 및 임베딩 미세조정 도구"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "OhMyLLM Team"}
]
keywords = ["nlp", "transformers", "gpt2", "japanese", "fine-tuning", "embeddings"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "transformers>=4.30.0",
    "datasets>=2.12.0",
    "tokenizers>=0.13.3",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "sentencepiece>=0.1.99",
]

[project.urls]
Homepage = "https://github.com/newro0209/ohmyllm"
Repository = "https://github.com/newro0209/ohmyllm"

[project.scripts]
ohmyllm-train = "train_model:main"
ohmyllm-tokenizer = "train_tokenizer:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
